<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#090a0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>
    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#090a0f"/>

  <!-- Blueprint Coordinate Grid Lines -->
  <g stroke="#141824" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="1360" y1="0" x2="1360" y2="900"/>
    <line x1="940" y1="0" x2="940" y2="900"/>
    <line x1="80" y1="120" x2="1360" y2="120"/>
  </g>

  <!-- Section Masthead -->
  <g transform="translate(80, 50)">
    <text x="0" y="0" font-size="11" font-family="monospace" fill="#7d8ca6" letter-spacing="1.5">03 / SIGNATURE INTERACTION DESIGN PROPOSAL</text>
    <text x="0" y="32" font-size="28" font-weight="700" fill="#f0f2f5">The Interactive Engineering <tspan font-style="italic" font-family="Georgia, serif">Atlas</tspan></text>
    <text x="0" y="56" font-size="13" fill="#9da7b8">Visualizing architectural relationships, shared design patterns, and systems boundaries across verified software repositories.</text>
  </g>

  <!-- Dual-Mode Accessibility Toggle Pills -->
  <g transform="translate(900, 50)">
    <rect x="0" y="6" width="380" height="40" rx="20" fill="#11131c" stroke="#242938" stroke-width="1"/>
    <!-- Active Graph Mode -->
    <rect x="4" y="10" width="180" height="32" rx="16" fill="#181b27" stroke="#353c52" stroke-width="1"/>
    <circle cx="24" cy="26" r="4" fill="#10b981"/>
    <text x="36" y="30" font-size="12" font-weight="600" fill="#f0f2f5">Graph Topology</text>
    <!-- Accessible Matrix Mode -->
    <text x="206" y="30" font-size="12" font-weight="500" fill="#7d8ca6">Accessible Data Matrix</text>
  </g>

  <!-- Left: Main Atlas Topology Canvas -->
  <g transform="translate(80, 140)">
    <!-- Canvas frame with double bezel -->
    <rect x="0" y="0" width="830" height="720" rx="16" fill="#11131c" stroke="#242938" stroke-width="1"/>
    <rect x="8" y="8" width="814" height="704" rx="12" fill="#0d0f17" stroke="#181b27" stroke-width="1"/>

    <!-- Grid Matrix coordinates -->
    <text x="24" y="32" font-size="10" font-family="monospace" fill="#353c52">TOPOLOGY_COORDINATES: LAT: 14.5995° N, LON: 120.9842° E // MESH_STATUS: SYNCHRONIZED</text>
    <text x="680" y="32" font-size="10" font-family="monospace" fill="#353c52">VERIFIED NODES: 05</text>

    <!-- Bus Lines / Architectural Pattern Vectors -->
    <g stroke="#242938" stroke-width="2" stroke-dasharray="4 4">
      <!-- Event Driven IO: Node 1 to Node 2 -->
      <path d="M 220 180 L 400 180 L 610 180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="none"/>
      <!-- Fault Isolation: Node 2 to Node 3 -->
      <path d="M 610 240 L 610 400 L 220 400" stroke="#10b981" stroke-width="1.5"/>
      <!-- Sub-16ms Paint Budget: Node 2 to Node 5 -->
      <path d="M 610 240 L 610 580 L 415 580" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Deterministic Validation: Node 1 to Node 4 -->
      <path d="M 220 240 L 220 540 L 320 540" stroke="#7d8ca6" stroke-width="1.5"/>
    </g>

    <!-- Pattern Hub Badges on Vectors -->
    <g transform="translate(330, 166)">
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#181b27" stroke="#3b82f6" stroke-width="1"/>
      <text x="80" y="17" font-size="10" font-family="monospace" font-weight="600" fill="#f0f2f5" text-anchor="middle">⚡ Event-Driven I/O</text>
    </g>

    <g transform="translate(370, 388)">
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#181b27" stroke="#10b981" stroke-width="1"/>
      <text x="85" y="17" font-size="10" font-family="monospace" font-weight="600" fill="#f0f2f5" text-anchor="middle">🛡️ Fault Isolation Boundary</text>
    </g>

    <g transform="translate(480, 568)">
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#181b27" stroke="#f59e0b" stroke-width="1"/>
      <text x="85" y="17" font-size="10" font-family="monospace" font-weight="600" fill="#f0f2f5" text-anchor="middle">⏱️ Sub-16ms Paint Budget</text>
    </g>

    <!-- Node 1: sentinel-organizer -->
    <g transform="translate(100, 130)">
      <rect x="0" y="0" width="240" height="100" rx="10" fill="#11131c" stroke="#353c52" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#10b981"/>
      <text x="34" y="28" font-size="11" font-family="monospace" font-weight="700" fill="#f0f2f5">sentinel-organizer</text>
      <text x="20" y="52" font-size="11" fill="#9da7b8">Systems &amp; File Automation</text>
      <rect x="20" y="66" width="60" height="20" rx="4" fill="#181b27"/>
      <text x="50" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">Python</text>
      <rect x="88" y="66" width="70" height="20" rx="4" fill="#181b27"/>
      <text x="123" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">Watchdog</text>
      <rect x="166" y="66" width="60" height="20" rx="4" fill="#181b27"/>
      <text x="196" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">SHA-256</text>
    </g>

    <!-- Node 2: meeting-mode (Active / Selected Node) -->
    <g transform="translate(490, 130)" filter="url(#glowSubtle)">
      <rect x="0" y="0" width="260" height="110" rx="10" fill="#141c2c" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="20" cy="24" r="6" fill="#3b82f6"/>
      <text x="34" y="28" font-size="12" font-family="monospace" font-weight="700" fill="#f0f2f5">meeting-mode ★ SELECTED</text>
      <text x="20" y="52" font-size="11" fill="#9da7b8">Browser Privacy Engine (Edge Store)</text>
      <rect x="20" y="70" width="80" height="22" rx="4" fill="#182338"/>
      <text x="60" y="85" font-size="10" font-family="monospace" fill="#3b82f6" text-anchor="middle">TypeScript</text>
      <rect x="108" y="70" width="80" height="22" rx="4" fill="#182338"/>
      <text x="148" y="85" font-size="10" font-family="monospace" fill="#3b82f6" text-anchor="middle">Manifest V3</text>
      <rect x="196" y="70" width="50" height="22" rx="4" fill="#162e24"/>
      <text x="221" y="85" font-size="10" font-family="monospace" fill="#10b981" text-anchor="middle">Live</text>
    </g>

    <!-- Node 3: siaMeal-Snap -->
    <g transform="translate(100, 350)">
      <rect x="0" y="0" width="240" height="100" rx="10" fill="#11131c" stroke="#353c52" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#f59e0b"/>
      <text x="34" y="28" font-size="11" font-family="monospace" font-weight="700" fill="#f0f2f5">siaMeal-Snap</text>
      <text x="20" y="52" font-size="11" fill="#9da7b8">Mobile Vision &amp; Nutrition AI</text>
      <rect x="20" y="66" width="80" height="20" rx="4" fill="#181b27"/>
      <text x="60" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">React Native</text>
      <rect x="108" y="66" width="50" height="20" rx="4" fill="#181b27"/>
      <text x="133" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">Expo</text>
      <rect x="166" y="66" width="55" height="20" rx="4" fill="#181b27"/>
      <text x="193" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">Flask</text>
    </g>

    <!-- Node 4: QuickAid-Geomapping -->
    <g transform="translate(100, 530)">
      <rect x="0" y="0" width="240" height="100" rx="10" fill="#11131c" stroke="#353c52" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#10b981"/>
      <text x="34" y="28" font-size="11" font-family="monospace" font-weight="700" fill="#f0f2f5">QuickAid-Geomapping</text>
      <text x="20" y="52" font-size="11" fill="#9da7b8">Spatial Disaster Incident Triage</text>
      <rect x="20" y="66" width="75" height="20" rx="4" fill="#181b27"/>
      <text x="57" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">TypeScript</text>
      <rect x="103" y="66" width="60" height="20" rx="4" fill="#181b27"/>
      <text x="133" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">Leaflet</text>
      <rect x="171" y="66" width="55" height="20" rx="4" fill="#181b27"/>
      <text x="198" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">GeoJSON</text>
    </g>

    <!-- Node 5: valence-capital-landing-page -->
    <g transform="translate(490, 530)">
      <rect x="0" y="0" width="260" height="100" rx="10" fill="#11131c" stroke="#353c52" stroke-width="1"/>
      <circle cx="20" cy="24" r="5" fill="#10b981"/>
      <text x="34" y="28" font-size="11" font-family="monospace" font-weight="700" fill="#f0f2f5">valence-capital-landing</text>
      <text x="20" y="52" font-size="11" fill="#9da7b8">High-Performance Kinetic UI</text>
      <rect x="20" y="66" width="75" height="20" rx="4" fill="#181b27"/>
      <text x="57" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">TypeScript</text>
      <rect x="103" y="66" width="75" height="20" rx="4" fill="#181b27"/>
      <text x="140" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">Tailwind v4</text>
      <rect x="186" y="66" width="60" height="20" rx="4" fill="#181b27"/>
      <text x="216" y="80" font-size="10" font-family="monospace" fill="#7d8ca6" text-anchor="middle">CSS Math</text>
    </g>
  </g>

  <!-- Right: Architecture Inspector Panel -->
  <g transform="translate(940, 140)">
    <rect x="0" y="0" width="420" height="720" rx="16" fill="#11131c" stroke="#242938" stroke-width="1"/>
    
    <g transform="translate(30, 36)">
      <!-- Panel Header -->
      <text x="0" y="0" font-size="11" font-family="monospace" fill="#7d8ca6" letter-spacing="1">ARCHITECTURAL INSPECTOR</text>
      <text x="0" y="32" font-size="22" font-weight="700" fill="#f0f2f5">MeetingMode Architecture</text>
      <text x="0" y="52" font-size="12" font-family="monospace" fill="#10b981">Verified Product: Microsoft Edge Store</text>

      <!-- Store Verification Card -->
      <rect x="0" y="70" width="360" height="60" rx="8" fill="#181b27" stroke="#242938" stroke-width="1"/>
      <text x="16" y="94" font-size="10" font-family="monospace" fill="#7d8ca6">ADD-ON ID</text>
      <text x="16" y="112" font-size="11" font-family="monospace" fill="#f0f2f5">pnfahfnonohbgnbgdalegoicoldkbkno</text>
      <rect x="270" y="84" width="74" height="32" rx="4" fill="#14261d" stroke="#10b981" stroke-width="1"/>
      <text x="307" y="104" font-size="10" font-family="monospace" font-weight="600" fill="#10b981" text-anchor="middle">VERIFIED</text>

      <!-- Architectural Invariants -->
      <text x="0" y="165" font-size="12" font-weight="600" fill="#f0f2f5">Architectural Invariants &amp; Constraints</text>
      
      <g transform="translate(0, 185)">
        <rect x="0" y="0" width="360" height="72" rx="6" fill="#0d0f17" stroke="#181b27" stroke-width="1"/>
        <text x="14" y="24" font-size="11" font-weight="600" fill="#3b82f6">01 / Isolated World Sandbox Execution</text>
        <text x="14" y="44" font-size="11" fill="#9da7b8">Script execution cannot be intercepted or poisoned by host</text>
        <text x="14" y="60" font-size="11" fill="#9da7b8">web page JavaScript variables or prototype alterations.</text>
      </g>

      <g transform="translate(0, 270)">
        <rect x="0" y="0" width="360" height="72" rx="6" fill="#0d0f17" stroke="#181b27" stroke-width="1"/>
        <text x="14" y="24" font-size="11" font-weight="600" fill="#10b981">02 / Frame Budgeting &amp; Mutation Batching</text>
        <text x="14" y="44" font-size="11" fill="#9da7b8">Debounces DOM mutations into a single microtask batch,</text>
        <text x="14" y="60" font-size="11" fill="#9da7b8">keeping paint latency &lt; 4.2ms to preserve video call FPS.</text>
      </g>

      <g transform="translate(0, 355)">
        <rect x="0" y="0" width="360" height="72" rx="6" fill="#0d0f17" stroke="#181b27" stroke-width="1"/>
        <text x="14" y="24" font-size="11" font-weight="600" fill="#f59e0b">03 / Zero Forced Reflows (Layout Invariant)</text>
        <text x="14" y="44" font-size="11" fill="#9da7b8">Applies CSS backdrop-filter shaders rather than altering</text>
        <text x="14" y="60" font-size="11" fill="#9da7b8">DOM dimensions, eliminating Cumulative Layout Shift (CLS = 0).</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(0, 450)">
        <rect x="0" y="0" width="360" height="46" rx="8" fill="#181b27" stroke="#3b82f6" stroke-width="1"/>
        <text x="180" y="28" font-size="13" font-weight="600" fill="#f0f2f5" text-anchor="middle">Read Full Case Study →</text>
      </g>

      <!-- Keyboard Accessibility Hint -->
      <g transform="translate(0, 520)">
        <rect x="0" y="0" width="360" height="75" rx="6" fill="#090a0f" stroke="#242938" stroke-width="1"/>
        <text x="14" y="24" font-size="10" font-family="monospace" fill="#7d8ca6">KEYBOARD &amp; SCREEN READER ACCESSIBILITY</text>
        <text x="14" y="44" font-size="11" fill="#9da7b8">Press [Tab] to navigate nodes. Press [Enter] to inspect.</text>
        <text x="14" y="62" font-size="11" fill="#3b82f6">Switch to Tabular Matrix View for accessible non-animated table.</text>
      </g>
    </g>
  </g>
</svg>