<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#fbf9f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="mShadowV2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="390" height="844" fill="#fbf9f5"/>

  <!-- Top Mobile Masthead -->
  <g transform="translate(20, 20)">
    <rect x="0" y="4" width="32" height="32" rx="4" fill="#161614"/>
    <text x="16" y="25" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#fbf9f5" text-anchor="middle">JM</text>
    
    <text x="40" y="18" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#161614">JAMES DE MESA</text>
    <text x="40" y="32" font-family="monospace" font-size="9" fill="#747269">DIGITAL CRAFT // SYSTEMS</text>

    <!-- Quick Inquire Pill -->
    <rect x="260" y="6" width="90" height="30" rx="15" fill="#b84218"/>
    <text x="305" y="25" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Inquire →</text>
  </g>
  <line x1="20" y1="68" x2="370" y2="68" stroke="#ede7de" stroke-width="1"/>

  <!-- Mobile Hero Section -->
  <g transform="translate(20, 85)">
    <!-- Availability Pill -->
    <rect x="0" y="0" width="230" height="22" rx="11" fill="#f2eee7" stroke="#dfdbd2" stroke-width="1"/>
    <circle cx="10" cy="11" r="3.5" fill="#10b981"/>
    <text x="20" y="15" font-family="monospace" font-size="8.5" font-weight="600" fill="#46443e">OPEN TO SELECT PROJECTS</text>

    <!-- Editorial Headline -->
    <text x="0" y="48" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#161614" line-height="1.2">
      Engineering <tspan font-style="italic" fill="#b84218">tailored</tspan>
    </text>
    <text x="0" y="82" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#161614">
      web platforms &amp;
    </text>
    <text x="0" y="116" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#161614">
      custom systems.
    </text>

    <text x="0" y="146" font-size="12" fill="#58564e">
      <tspan x="0" dy="0">High-converting websites, Full Site Editing</tspan>
      <tspan x="0" dy="18">themes, and full-stack applications built for scale.</tspan>
    </text>

    <!-- Client Service Pills -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#161614"/>
      <text x="52" y="18" font-size="10" font-weight="600" fill="#fbf9f5" text-anchor="middle">WordPress FSE</text>

      <rect x="113" y="0" width="115" height="28" rx="14" fill="#ffffff" stroke="#dfdbd2" stroke-width="1"/>
      <text x="170" y="18" font-size="10" font-weight="500" fill="#46443e" text-anchor="middle">Full-Stack Apps</text>

      <rect x="236" y="0" width="114" height="28" rx="14" fill="#ffffff" stroke="#dfdbd2" stroke-width="1"/>
      <text x="293" y="18" font-size="10" font-weight="500" fill="#46443e" text-anchor="middle">E-Commerce</text>
    </g>
  </g>

  <!-- Contrasting Dark Mobile Card Section -->
  <g transform="translate(20, 335)">
    <rect x="0" y="0" width="350" height="410" rx="16" fill="#0d0f14" stroke="#1f2433" stroke-width="1" filter="url(#mShadowV2)"/>

    <g transform="translate(18, 18)">
      <text x="0" y="14" font-family="monospace" font-size="9" font-weight="700" fill="#e5c07b">FEATURED WORK 01 // WORDPRESS</text>
      <text x="0" y="38" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f0f3f8">Thread &amp; Form Theme</text>
      <text x="0" y="56" font-size="11" fill="#9da7b8">WordPress 6.7+ Full Site Editing (FSE)</text>

      <!-- Simple Labeled Tab Switcher (No Drag Required) -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="314" height="32" rx="16" fill="#151922" stroke="#232a3b" stroke-width="1"/>
        <rect x="2" y="2" width="155" height="28" rx="14" fill="#b84218"/>
        <text x="80" y="20" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">● Finished Product</text>
        <text x="235" y="20" font-size="10" font-weight="500" fill="#9da7b8" text-anchor="middle">Behind the Build</text>
      </g>

      <!-- Visual Preview Box (Dark Framing) -->
      <g transform="translate(0, 118)">
        <rect x="0" y="0" width="314" height="155" rx="8" fill="#181d2a" stroke="#2d3548" stroke-width="1"/>
        
        <g transform="translate(14, 14)">
          <text x="0" y="12" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#f0f2f5" letter-spacing="1">THREAD &amp; FORM</text>
          <line x1="0" y1="20" x2="286" y2="20" stroke="#2d3548" stroke-width="1"/>
          
          <rect x="0" y="28" width="130" height="95" rx="4" fill="#242b3d"/>
          <text x="65" y="78" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#9da7b8" text-anchor="middle">Lookbook</text>

          <rect x="140" y="28" width="146" height="42" rx="4" fill="#242b3d"/>
          <text x="150" y="46" font-size="9" font-weight="600" fill="#f0f2f5">Wool Trench Coat</text>
          <text x="150" y="60" font-family="monospace" font-size="8.5" fill="#e5c07b">$480 • In Stock</text>

          <rect x="140" y="78" width="146" height="45" rx="4" fill="#242b3d"/>
          <text x="150" y="96" font-size="9" font-weight="600" fill="#f0f2f5">Gutenberg Block UI</text>
          <text x="150" y="110" font-size="8" fill="#9da7b8">100% Client-Editable</text>
        </g>
      </g>

      <!-- Verified Badges -->
      <g transform="translate(0, 290)">
        <text x="0" y="14" font-size="10" font-weight="600" fill="#f0f2f5">Verified Architecture:</text>
        <text x="0" y="32" font-size="10" fill="#9da7b8">Zero Plugin Dependencies • Pure theme.json Tokens</text>
        <rect x="0" y="44" width="314" height="26" rx="6" fill="#151922"/>
        <text x="157" y="61" font-family="monospace" font-size="9" fill="#e5c07b" text-anchor="middle">Stack: WordPress 6.7+ FSE • PHP 8.3 • CSS</text>
      </g>
    </g>
  </g>

  <!-- Sticky Mobile Conversion Dock -->
  <g transform="translate(20, 765)">
    <rect x="0" y="0" width="350" height="52" rx="26" fill="#161614" filter="url(#mShadowV2)"/>
    <text x="145" y="31" font-size="13" font-weight="600" fill="#fbf9f5" text-anchor="middle">Start a Project With James →</text>
    <circle cx="316" cy="26" r="14" fill="#b84218"/>
    <text x="316" y="31" font-size="12" fill="#ffffff" text-anchor="middle">✉</text>
  </g>
</svg>