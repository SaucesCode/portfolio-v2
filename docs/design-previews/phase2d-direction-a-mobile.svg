<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#fbf9f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Mobile Canvas Background -->
  <rect width="390" height="844" fill="#fbf9f5"/>

  <!-- Top Navigation Bar -->
  <g transform="translate(20, 20)">
    <text x="0" y="24" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#161614">JAMES DE MESA</text>
    <text x="0" y="38" font-family="monospace" font-size="9" fill="#747269">DIGITAL CRAFT &amp; WEB SYSTEMS</text>

    <!-- Quick Inquire Pill -->
    <rect x="260" y="8" width="90" height="32" rx="16" fill="#161614"/>
    <text x="305" y="28" font-size="11" font-weight="600" fill="#fbf9f5" text-anchor="middle">Inquire →</text>
  </g>
  <line x1="20" y1="70" x2="370" y2="70" stroke="#dfdbd2" stroke-width="1"/>

  <!-- Hero Section -->
  <g transform="translate(20, 95)">
    <!-- 5-Second Clarity Badge -->
    <rect x="0" y="0" width="230" height="24" rx="12" fill="#f0ede6" stroke="#dfdbd2" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#b84218"/>
    <text x="22" y="16" font-family="monospace" font-size="9" font-weight="600" fill="#46443e">BESPOKE WEB &amp; WORDPRESS</text>

    <!-- Editorial Headline -->
    <text x="0" y="52" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#161614" line-height="1.2">
      Crafting <tspan font-style="italic" fill="#b84218">bespoke</tspan>
    </text>
    <text x="0" y="88" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#161614">
      web platforms &amp;
    </text>
    <text x="0" y="124" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#161614">
      WordPress themes.
    </text>

    <!-- Short Mobile Subhead -->
    <text x="0" y="156" font-size="13" fill="#58564e">
      <tspan x="0" dy="0">High-converting websites and custom full-stack</tspan>
      <tspan x="0" dy="18">platforms built with design elegance &amp; speed.</tspan>
    </text>
  </g>

  <!-- Mobile Interactive Project Card with Toggle -->
  <g transform="translate(20, 290)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="350" height="450" rx="16" fill="#ffffff" stroke="#dfdbd2" stroke-width="1" filter="url(#mShadow)"/>

    <g transform="translate(18, 20)">
      <!-- Card Header -->
      <text x="0" y="14" font-family="monospace" font-size="9" font-weight="700" fill="#b84218">FEATURED PROJECT 01</text>
      <text x="0" y="38" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#161614">Thread &amp; Form Theme</text>
      <text x="0" y="56" font-size="11" fill="#58564e">Custom WordPress FSE Theme for luxury retail.</text>

      <!-- Mobile Tap-to-Flip Mode Selector -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="314" height="32" rx="16" fill="#f0ede6" stroke="#dfdbd2" stroke-width="1"/>
        <rect x="2" y="2" width="155" height="28" rx="14" fill="#ffffff"/>
        <text x="80" y="20" font-size="10" font-weight="600" fill="#161614" text-anchor="middle">● Finished Site</text>
        <text x="235" y="20" font-size="10" font-weight="500" fill="#747269" text-anchor="middle">Behind the Build</text>
      </g>

      <!-- Visual Preview Box -->
      <g transform="translate(0, 118)">
        <rect x="0" y="0" width="314" height="190" rx="10" fill="#fcfbf9" stroke="#ede9e1" stroke-width="1"/>
        
        <!-- Mobile Editorial Artwork Mockup -->
        <g transform="translate(15, 15)">
          <text x="0" y="14" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#161614" letter-spacing="1">THREAD &amp; FORM</text>
          <line x1="0" y1="22" x2="284" y2="22" stroke="#dfdbd2" stroke-width="1"/>
          <rect x="0" y="32" width="134" height="115" rx="4" fill="#ebe4d8"/>
          <text x="67" y="92" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#747269" text-anchor="middle">Lookbook</text>

          <rect x="146" y="32" width="138" height="52" rx="4" fill="#ede7dc"/>
          <text x="156" y="52" font-size="10" font-weight="600" fill="#161614">Wool Trench</text>
          <text x="156" y="68" font-family="monospace" font-size="9" fill="#b84218">$480 USD</text>

          <rect x="146" y="92" width="138" height="55" rx="4" fill="#ede7dc"/>
          <text x="156" y="112" font-size="10" font-weight="600" fill="#161614">Linen Trousers</text>
          <text x="156" y="128" font-family="monospace" font-size="9" fill="#b84218">$260 USD</text>
        </g>
      </g>

      <!-- Client Metrics & Stack -->
      <g transform="translate(0, 325)">
        <text x="0" y="14" font-size="11" font-weight="600" fill="#161614">Client Results:</text>
        <text x="0" y="32" font-size="11" fill="#58564e">3.2× speed improvement • 100% Gutenberg editable • 0 plugins</text>
        <rect x="0" y="44" width="314" height="26" rx="6" fill="#f0ede6"/>
        <text x="157" y="61" font-family="monospace" font-size="10" fill="#46443e" text-anchor="middle">Stack: WordPress 6.7+ FSE • PHP 8.3 • CSS</text>
      </g>
    </g>
  </g>

  <!-- Sticky Bottom Conversion Dock -->
  <g transform="translate(20, 765)">
    <rect x="0" y="0" width="350" height="52" rx="26" fill="#161614" filter="url(#mShadow)"/>
    <text x="135" y="31" font-size="13" font-weight="600" fill="#fbf9f5" text-anchor="middle">Start a Project With James →</text>
    <circle cx="316" cy="26" r="14" fill="#b84218"/>
    <text x="316" y="31" font-size="12" fill="#ffffff" text-anchor="middle">✉</text>
  </g>
</svg>