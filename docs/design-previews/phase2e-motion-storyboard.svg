<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#090a0f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <!-- Background Canvas -->
  <rect width="1440" height="900" fill="#090a0f"/>

  <!-- Hairline Blueprint Grid -->
  <line x1="80" y1="0" x2="80" y2="900" stroke="#161b26" stroke-width="1"/>
  <line x1="1360" y1="0" x2="1360" y2="900" stroke="#161b26" stroke-width="1"/>
  <line x1="80" y1="100" x2="1360" y2="100" stroke="#161b26" stroke-width="1"/>

  <!-- Section Header -->
  <g transform="translate(80, 45)">
    <text x="0" y="0" font-family="monospace" font-size="11" font-weight="700" fill="#b84218" letter-spacing="1.5">04 / MOTION DESIGN SYSTEM &amp; CHOREOGRAPHY STORYBOARD</text>
    <text x="0" y="34" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#f0f3f8">Choreography &amp; Route Transitions: <tspan font-style="italic" fill="#e5c07b">Timing &amp; Easing Tokens</tspan></text>
    <text x="0" y="58" font-size="13" fill="#9da7b8">Engineered for immediate responsiveness (&lt;100ms feedback) and smooth 60fps rendering via CSS transforms and opacity.</text>
  </g>

  <!-- Storyboard Timeline Sequence: 4 Phases -->
  <!-- Phase 1: Masthead Stamp -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="295" height="420" rx="10" fill="#11141c" stroke="#1f2433" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="70" height="20" rx="10" fill="#1b212f"/>
      <text x="35" y="14" font-family="monospace" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">PHASE 01</text>
      <text x="0" y="44" font-size="14" font-weight="700" fill="#f0f3f8">Masthead Stamp &amp; Nav</text>
      <text x="0" y="62" font-family="monospace" font-size="10" fill="#e5c07b">0ms → 120ms • Opacity Fade</text>

      <rect x="0" y="80" width="255" height="180" rx="6" fill="#181d2a" stroke="#283247" stroke-width="1"/>
      <g transform="translate(16, 20)">
        <rect x="0" y="0" width="30" height="30" rx="4" fill="#161614"/>
        <text x="15" y="20" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#fbf9f5" text-anchor="middle">JM</text>
        <text x="40" y="18" font-size="12" font-weight="700" fill="#f0f3f8">JAMES DE MESA</text>
        <line x1="0" y1="42" x2="223" y2="42" stroke="#283247" stroke-width="1"/>
        <rect x="0" y="54" width="180" height="20" rx="10" fill="#1f2433"/>
        <circle cx="10" cy="64" r="3" fill="#10b981"/>
        <text x="18" y="67" font-size="8" fill="#34d399">OPEN TO NEW PROJECTS</text>
        <text x="0" y="110" font-size="10" fill="#9da7b8">CSS: opacity: 0 → 1</text>
        <text x="0" y="128" font-size="10" fill="#9da7b8">Duration: 120ms</text>
        <text x="0" y="146" font-size="10" fill="#9da7b8">Ease: ease-out-cubic</text>
      </g>

      <g transform="translate(0, 280)">
        <text x="0" y="16" font-size="11" font-weight="600" fill="#f0f3f8">UX Objective:</text>
        <text x="0" y="34" font-size="10" fill="#9da7b8">Anchor brand identity immediately without delaying content access.</text>
      </g>
    </g>
  </g>

  <!-- Phase 2: Eyebrow & Hero Typography -->
  <g transform="translate(395, 130)">
    <rect x="0" y="0" width="295" height="420" rx="10" fill="#11141c" stroke="#1f2433" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="70" height="20" rx="10" fill="#1b212f"/>
      <text x="35" y="14" font-family="monospace" font-size="9" font-weight="700" fill="#e5c07b" text-anchor="middle">PHASE 02</text>
      <text x="0" y="44" font-size="14" font-weight="700" fill="#f0f3f8">Hero Typography Stagger</text>
      <text x="0" y="62" font-family="monospace" font-size="10" fill="#e5c07b">100ms → 260ms • 8px Lift</text>

      <rect x="0" y="80" width="255" height="180" rx="6" fill="#181d2a" stroke="#283247" stroke-width="1"/>
      <g transform="translate(16, 20)">
        <text x="0" y="14" font-family="monospace" font-size="8" fill="#b84218">01 / DIGITAL CRAFT</text>
        <text x="0" y="40" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fbf9f5">Engineering tailored</text>
        <text x="0" y="60" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#e5c07b">web platforms.</text>
        <line x1="0" y1="80" x2="223" y2="80" stroke="#283247" stroke-width="1"/>
        <text x="0" y="105" font-size="10" fill="#9da7b8">CSS: translateY(8px) → 0px</text>
        <text x="0" y="125" font-size="10" fill="#9da7b8">Duration: 160ms</text>
        <text x="0" y="145" font-size="10" fill="#9da7b8">Ease: cubic-bezier(0.16, 1, 0.3, 1)</text>
      </g>

      <g transform="translate(0, 280)">
        <text x="0" y="16" font-size="11" font-weight="600" fill="#f0f3f8">UX Objective:</text>
        <text x="0" y="34" font-size="10" fill="#9da7b8">Lead client attention straight to the core service offering.</text>
      </g>
    </g>
  </g>

  <!-- Phase 3: Service Selector Pills -->
  <g transform="translate(710, 130)">
    <rect x="0" y="0" width="295" height="420" rx="10" fill="#11141c" stroke="#1f2433" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="70" height="20" rx="10" fill="#1b212f"/>
      <text x="35" y="14" font-family="monospace" font-size="9" font-weight="700" fill="#3b82f6" text-anchor="middle">PHASE 03</text>
      <text x="0" y="44" font-size="14" font-weight="700" fill="#f0f3f8">Service Selector Pills</text>
      <text x="0" y="62" font-family="monospace" font-size="10" fill="#e5c07b">220ms → 380ms • Tactile Scale</text>

      <rect x="0" y="80" width="255" height="180" rx="6" fill="#181d2a" stroke="#283247" stroke-width="1"/>
      <g transform="translate(16, 20)">
        <rect x="0" y="0" width="223" height="34" rx="4" fill="#242b3d" stroke="#3b82f6" stroke-width="1"/>
        <text x="12" y="21" font-size="10" font-weight="600" fill="#f0f3f8">Full-Stack Web Systems</text>
        
        <rect x="0" y="44" width="223" height="34" rx="4" fill="#242b3d" stroke="#b84218" stroke-width="1"/>
        <text x="12" y="65" font-size="10" font-weight="600" fill="#f0f3f8">WordPress &amp; FSE Themes</text>

        <rect x="0" y="88" width="223" height="34" rx="4" fill="#242b3d" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="109" font-size="10" font-weight="600" fill="#f0f3f8">E-Commerce &amp; Landing</text>

        <text x="0" y="145" font-size="9.5" fill="#9da7b8">Stagger interval: 40ms per pill</text>
      </g>

      <g transform="translate(0, 280)">
        <text x="0" y="16" font-size="11" font-weight="600" fill="#f0f3f8">UX Objective:</text>
        <text x="0" y="34" font-size="10" fill="#9da7b8">Deliver instantaneous interactive readiness for client navigation.</text>
      </g>
    </g>
  </g>

  <!-- Phase 4: Route Transitions & Reduced Motion Fallback -->
  <g transform="translate(1025, 130)">
    <rect x="0" y="0" width="335" height="420" rx="10" fill="#11141c" stroke="#1f2433" stroke-width="1"/>
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="70" height="20" rx="10" fill="#1b212f"/>
      <text x="35" y="14" font-family="monospace" font-size="9" font-weight="700" fill="#b84218" text-anchor="middle">PHASE 04</text>
      <text x="0" y="44" font-size="14" font-weight="700" fill="#f0f3f8">Route &amp; Reduced Motion</text>
      <text x="0" y="62" font-family="monospace" font-size="10" fill="#e5c07b">Next.js App Router Transition</text>

      <rect x="0" y="80" width="295" height="180" rx="6" fill="#181d2a" stroke="#283247" stroke-width="1"/>
      <g transform="translate(16, 20)">
        <text x="0" y="14" font-size="11" font-weight="700" fill="#fbf9f5">APP ROUTER SWAP (200MS)</text>
        <text x="0" y="36" font-size="10" fill="#9da7b8">Exit page: opacity 1 → 0 (80ms)</text>
        <text x="0" y="56" font-size="10" fill="#9da7b8">Enter page: opacity 0 → 1 (120ms)</text>
        <line x1="0" y1="74" x2="263" y2="74" stroke="#283247" stroke-width="1"/>
        <text x="0" y="96" font-family="monospace" font-size="9.5" fill="#34d399">WCAG 2.3.3 LEVEL AAA POLICY:</text>
        <text x="0" y="116" font-size="10" fill="#f0f3f8">prefers-reduced-motion: reduce</text>
        <text x="0" y="136" font-size="10" fill="#9da7b8">• All durations set to 0.001ms</text>
        <text x="0" y="154" font-size="10" fill="#9da7b8">• Instantaneous state switches</text>
      </g>

      <g transform="translate(0, 280)">
        <text x="0" y="16" font-size="11" font-weight="600" fill="#f0f3f8">UX Objective:</text>
        <text x="0" y="34" font-size="10" fill="#9da7b8">Zero motion sickness, zero layout shift, seamless client browsing.</text>
      </g>
    </g>
  </g>

  <!-- Motion Token Reference Matrix at Bottom -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="1280" height="280" rx="12" fill="#11141c" stroke="#1f2433" stroke-width="1"/>
    
    <g transform="translate(30, 25)">
      <text x="0" y="14" font-family="monospace" font-size="11" font-weight="700" fill="#e5c07b">MOTION TOKEN DICTIONARY &amp; ACCEPTANCE CRITERIA</text>
      
      <g transform="translate(0, 35)">
        <rect x="0" y="0" width="290" height="180" rx="6" fill="#090a0f" stroke="#1c2230" stroke-width="1"/>
        <text x="16" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#f0f3f8">Timing Scale</text>
        <text x="16" y="52" font-family="monospace" font-size="10" fill="#9da7b8">--duration-instant: <tspan fill="#34d399">80ms</tspan> (Active click)</text>
        <text x="16" y="74" font-family="monospace" font-size="10" fill="#9da7b8">--duration-fast: <tspan fill="#34d399">150ms</tspan> (Hover/Icons)</text>
        <text x="16" y="96" font-family="monospace" font-size="10" fill="#9da7b8">--duration-normal: <tspan fill="#34d399">250ms</tspan> (Curtain drag)</text>
        <text x="16" y="118" font-family="monospace" font-size="10" fill="#9da7b8">--duration-slow: <tspan fill="#34d399">400ms</tspan> (Modal/Drawer)</text>
        <text x="16" y="146" font-size="10" fill="#7d8ca6">Total entrance budget: &lt; 450ms</text>
      </g>

      <g transform="translate(315, 35)">
        <rect x="0" y="0" width="290" height="180" rx="6" fill="#090a0f" stroke="#1c2230" stroke-width="1"/>
        <text x="16" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#f0f3f8">Easing &amp; Springs</text>
        <text x="16" y="52" font-family="monospace" font-size="10" fill="#9da7b8">--ease-out-cubic:</text>
        <text x="24" y="70" font-family="monospace" font-size="9" fill="#e5c07b">cubic-bezier(0.33, 1, 0.68, 1)</text>
        <text x="16" y="96" font-family="monospace" font-size="10" fill="#9da7b8">--ease-spring:</text>
        <text x="24" y="114" font-family="monospace" font-size="9" fill="#e5c07b">cubic-bezier(0.16, 1, 0.3, 1)</text>
        <text x="16" y="146" font-size="10" fill="#7d8ca6">Hardware acceleration via transform</text>
      </g>

      <g transform="translate(630, 35)">
        <rect x="0" y="0" width="290" height="180" rx="6" fill="#090a0f" stroke="#1c2230" stroke-width="1"/>
        <text x="16" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#f0f3f8">Interactive Micro-States</text>
        <text x="16" y="52" font-size="10" fill="#9da7b8">• Button-in-button trailing arrow:</text>
        <text x="24" y="70" font-family="monospace" font-size="9.5" fill="#34d399">+4px translateX on hover (120ms)</text>
        <text x="16" y="96" font-size="10" fill="#9da7b8">• Project card hover lift:</text>
        <text x="24" y="114" font-family="monospace" font-size="9.5" fill="#34d399">-1.5px translateY + border glow</text>
        <text x="16" y="146" font-size="10" fill="#7d8ca6">Immediate feedback under 100ms</text>
      </g>

      <g transform="translate(945, 35)">
        <rect x="0" y="0" width="275" height="180" rx="6" fill="#090a0f" stroke="#1c2230" stroke-width="1"/>
        <text x="16" y="26" font-family="monospace" font-size="11" font-weight="700" fill="#f0f3f8">Target Goals (Browser Testing)</text>
        <text x="16" y="52" font-size="10" fill="#9da7b8">Target: 60fps on mid-range devices</text>
        <text x="16" y="74" font-size="10" fill="#9da7b8">Target: Zero forced reflows</text>
        <text x="16" y="96" font-size="10" fill="#9da7b8">Target: CLS &lt; 0.02, INP &lt; 100ms</text>
        <text x="16" y="118" font-size="10" fill="#9da7b8">Full prefers-reduced-motion support</text>
        <text x="16" y="146" font-size="10" fill="#34d399">Target: WCAG 2.2 AA &amp; AAA Motion</text>
      </g>
    </g>
  </g>
</svg>